# ─────────────────────────────────────────────────────────────────────────────
# Azure DevOps Pipeline — Claude Code AI Agent
#
# PURPOSE
#   This pipeline runs when triggered by Product Hub after tech refinement
#   completes. It boots a Claude Code agent that reads the ADO work items
#   tagged "ai-ready" and implements the feature, then opens a PR.
#
# SETUP
#   1. Commit this file to your application repo as .azure/claude-agent.yml
#   2. Create a new pipeline in ADO pointing at this file
#   3. Note the pipeline ID (shown in the pipeline URL)
#   4. Set AZURE_DEVOPS_AI_PIPELINE_ID=<id> in Product Hub's .env
#   5. Set ANTHROPIC_API_KEY as a secret pipeline variable in ADO
#
# TRIGGER
#   Product Hub calls POST /_apis/pipelines/<id>/runs to start a run.
#   The epicId and workflowId are passed as runtime variables.
# ─────────────────────────────────────────────────────────────────────────────

trigger: none   # Only triggered via API call from Product Hub

parameters:
  - name: epicId
    type: number
    default: 0
  - name: workflowId
    type: string
    default: ''
  - name: epicTitle
    type: string
    default: 'Feature implementation'
  - name: branchPrefix
    type: string
    default: 'feature/ai'

variables:
  - name: CLAUDE_BRANCH
    value: '${{ parameters.branchPrefix }}-${{ parameters.epicId }}'
  - group: claude-code-secrets   # Contains ANTHROPIC_API_KEY

pool:
  vmImage: ubuntu-latest

steps:
  # ── 1. Checkout ──────────────────────────────────────────────────────────────
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  # ── 2. Install Node + Claude Code CLI ────────────────────────────────────────
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20'

  - script: |
      npm install -g @anthropic-ai/claude-code
      claude --version
    displayName: 'Install Claude Code CLI'
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

  # ── 3. Configure git identity ─────────────────────────────────────────────────
  - script: |
      git config user.email "claude-code@pipeline.ai"
      git config user.name  "Claude Code Agent"
      git checkout -b $(CLAUDE_BRANCH)
    displayName: 'Create feature branch'

  # ── 4. Fetch ADO work item details ────────────────────────────────────────────
  - script: |
      set -e
      ADO_ORG="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI%/}"
      PROJECT="${SYSTEM_TEAMPROJECT}"

      # Fetch epic + child work items via ADO REST API
      curl -s -u ":$(System.AccessToken)" \
        "${ADO_ORG}/${PROJECT}/_apis/wit/workitems/${{ parameters.epicId }}?$expand=relations&api-version=7.1" \
        -o epic.json

      echo "Fetched epic:"
      cat epic.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['fields']['System.Title'])"

      # Build a human-readable ticket summary for Claude
      python3 - <<'PYEOF'
      import json, os

      with open('epic.json') as f:
          epic = json.load(f)

      fields = epic.get('fields', {})
      lines = [
          f"# Epic #{epic['id']}: {fields.get('System.Title', '')}",
          f"",
          f"**Description:** {fields.get('System.Description', '(none)')}",
          f"**Tags:** {fields.get('System.Tags', '')}",
          f"",
          f"## Acceptance criteria",
          fields.get('Microsoft.VSTS.Common.AcceptanceCriteria', '(none)'),
      ]

      with open('TICKET_BRIEF.md', 'w') as f:
          f.write('\n'.join(lines))

      print("TICKET_BRIEF.md written")
      PYEOF
    displayName: 'Fetch ticket details from ADO'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ── 5. Run Claude Code agent ──────────────────────────────────────────────────
  - script: |
      set -e
      PROMPT=$(cat <<'PROMPT'
      You are implementing a feature described in TICKET_BRIEF.md in this repository.

      Steps:
      1. Read TICKET_BRIEF.md to understand what needs to be built
      2. Explore the existing codebase structure to understand conventions
      3. Implement the feature following existing patterns and style
      4. Write unit tests for the new code
      5. Ensure the implementation compiles/passes existing tests
      6. Do NOT commit — the pipeline will handle the git operations

      Constraints:
      - Match existing code style exactly
      - Only create/modify files relevant to this feature
      - Keep changes minimal and focused
      PROMPT
      )

      claude \
        --allowedTools "Read,Write,Edit,Bash,Glob,Grep" \
        --max-turns 40 \
        --permission-prompt-tool sh \
        "$PROMPT"
    displayName: 'Run Claude Code agent'
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

  # ── 6. Commit and push ────────────────────────────────────────────────────────
  - script: |
      set -e
      git add -A
      if git diff --staged --quiet; then
        echo "No changes to commit"
        exit 0
      fi
      git commit -m "feat: implement Epic #${{ parameters.epicId }} — ${{ parameters.epicTitle }}

      Generated by Claude Code Agent
      ADO Epic: #${{ parameters.epicId }}
      Product Hub Workflow: ${{ parameters.workflowId }}
      Pipeline Run: $(Build.BuildId)"

      git push origin $(CLAUDE_BRANCH) --force-with-lease
    displayName: 'Commit and push changes'

  # ── 7. Create Pull Request ────────────────────────────────────────────────────
  - script: |
      set -e
      ADO_ORG="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI%/}"
      PROJECT="${SYSTEM_TEAMPROJECT}"
      REPO="${BUILD_REPOSITORY_NAME}"

      BODY=$(cat <<JSON
      {
        "title": "feat: ${{ parameters.epicTitle }}",
        "description": "Implemented by Claude Code Agent from ADO Epic #${{ parameters.epicId }}.\n\nWorkflow: ${{ parameters.workflowId }}\nPipeline run: $(Build.BuildId)",
        "sourceRefName": "refs/heads/$(CLAUDE_BRANCH)",
        "targetRefName": "refs/heads/main",
        "reviewers": []
      }
      JSON
      )

      curl -s -u ":$(System.AccessToken)" \
        -X POST \
        -H "Content-Type: application/json" \
        -d "$BODY" \
        "${ADO_ORG}/${PROJECT}/_apis/git/repositories/${REPO}/pullrequests?api-version=7.1" \
        | python3 -c "import sys,json; d=json.load(sys.stdin); print('PR created:', d.get('pullRequestId'), d.get('webUrl',''))"
    displayName: 'Create Pull Request'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
