# Agent User Configuration
# Copy this file to config.yaml and fill in your details.
# These values are injected into every agent session.

# Your name — agents will address you by this in conversation
user_name: Your Name

# Language for all agent communication and document output
communication_language: English
document_output_language: English

# Your product / project name (used in document titles and context)
project_name: My Product

# Your experience level — affects how much context agents provide
# Options: beginner, intermediate, expert
user_skill_level: intermediate

# Sprint planning — used to estimate sprints required at the epic level
# team_size: total number of engineers working on the epic (dev + QA + all roles combined)
# velocity_per_member: story points one engineer delivers per 2-week sprint
team_size: 5
velocity_per_member: 5
